[tool.black]
line-length = 88
target-version = ["py310"]
required-version = "26.10.1"
extend-exclude = "/(data|\\.venv)/"

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
known_first_party = ["database", "decks", "legality", "scryfall"]

[tool.pylint.main]
py-version = "3.10"
ignore = [".venv", "data", "__pycache__"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.reports]
score = false

[tool.pylint."messages control"]
# Black owns wrapping; Pylint otherwise retains its default checks.
disable = ["line-too-long"]

[tool.bandit]
exclude_dirs = [".venv", "data", "__pycache__"]
