[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commander-simulator"
version = "0.1.0"
description = "A four-player Commander heuristic simulator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
commander-simulator = "commander_simulator.cli:main"

[tool.setuptools.packages.find]
include = ["commander_simulator*"]

[tool.setuptools.package-data]
commander_simulator = ["data/*.json", "data/*.txt"]
