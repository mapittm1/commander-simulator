repos:
  - repo: local
    hooks:
      - id: python-quality
        name: Black, isort, Pylint, Bandit, and pytest
        entry: python tools/check.py
        language: python
        additional_dependencies:
          - black==26.10.1
          - isort==9.0.2
          - pylint==4.1.3
          - bandit==1.9.4
          - pytest==9.1.1
        pass_filenames: false
        always_run: true
